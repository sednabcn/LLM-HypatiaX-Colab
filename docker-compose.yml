# ==============================================================================
# HypatiaX Docker Compose Configuration
# Supports all stages: development, testing, production, API, notebook
# Python versions: 3.12 (stable), 3.13 (latest)
# ==============================================================================

services:
  # ============================================================================
  # DEVELOPMENT SERVICES
  # ============================================================================
  
  # Development environment with Python 3.12
  hypatiax-py312:
    build:
      context: .
      target: development
      args:
        PYTHON_VERSION: 3.12
    image: hypatiax:dev-py312
    container_name: hypatiax-dev-py312
    volumes:
      # Mount current directory for live code updates
      - .:/workspace/hypatiax
      # Cache pip packages for faster rebuilds
      - hypatiax-cache-py312:/root/.cache
    environment:
      - HYPATIAX_ENV=docker
      - PYTHONPATH=/workspace/hypatiax
      - HYPATIAX_OUTPUT_DIR=/workspace/hypatiax/outputs
    ports:
      - "8888:8888"  # Jupyter
      - "8000:8000"  # API/debugging
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - hypatiax-network

  # Development environment with Python 3.13
  hypatiax-py313:
    build:
      context: .
      target: development
      args:
        PYTHON_VERSION: 3.13
    image: hypatiax:dev-py313
    container_name: hypatiax-dev-py313
    volumes:
      - .:/workspace/hypatiax
      - hypatiax-cache-py313:/root/.cache
    environment:
      - HYPATIAX_ENV=docker
      - PYTHONPATH=/workspace/hypatiax
      - HYPATIAX_OUTPUT_DIR=/workspace/hypatiax/outputs
    ports:
      - "8889:8888"  # Jupyter (different port to avoid conflict)
      - "8001:8000"  # API/debugging (different port)
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - hypatiax-network

  # ============================================================================
  # TESTING SERVICES
  # ============================================================================
  
  # Testing with Python 3.12
  hypatiax-test-py312:
    build:
      context: .
      target: testing
      args:
        PYTHON_VERSION: 3.12
    image: hypatiax:test-py312
    container_name: hypatiax-test-py312
    volumes:
      # Mount code for testing
      - .:/workspace/hypatiax
      # Persist test results and coverage reports
      - ./test-results/py312:/workspace/hypatiax/htmlcov
      - ./test-results/py312/.coverage:/workspace/hypatiax/.coverage
    environment:
      - HYPATIAX_ENV=testing
      - HYPATIAX_OUTPUT_DIR=/tmp/hypatiax_test_outputs
      - PYTEST_ADDOPTS=-v --cov=hypatiax --cov-report=html --cov-report=term
    networks:
      - hypatiax-network

  # Testing with Python 3.13
  hypatiax-test-py313:
    build:
      context: .
      target: testing
      args:
        PYTHON_VERSION: 3.13
    image: hypatiax:test-py313
    container_name: hypatiax-test-py313
    volumes:
      - .:/workspace/hypatiax
      - ./test-results/py313:/workspace/hypatiax/htmlcov
      - ./test-results/py313/.coverage:/workspace/hypatiax/.coverage
    environment:
      - HYPATIAX_ENV=testing
      - HYPATIAX_OUTPUT_DIR=/tmp/hypatiax_test_outputs
      - PYTEST_ADDOPTS=-v --cov=hypatiax --cov-report=html --cov-report=term
    networks:
      - hypatiax-network

  # ============================================================================
  # PRODUCTION SERVICE
  # ============================================================================
  
  hypatiax-prod:
    build:
      context: .
      target: production
      args:
        PYTHON_VERSION: 3.12
    image: hypatiax:prod
    container_name: hypatiax-prod
    volumes:
      # Mount output directory only (no source code)
      - ./outputs:/tmp/hypatiax_outputs
    environment:
      - HYPATIAX_ENV=production
      - HYPATIAX_OUTPUT_DIR=/tmp/hypatiax_outputs
    restart: unless-stopped
    networks:
      - hypatiax-network
    # Uncomment for resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

  # ============================================================================
  # API SERVICE
  # ============================================================================
  
  hypatiax-api:
    build:
      context: .
      target: api
      args:
        PYTHON_VERSION: 3.12
    image: hypatiax:api
    container_name: hypatiax-api
    volumes:
      - ./outputs:/tmp/hypatiax_outputs
    environment:
      - HYPATIAX_ENV=production
      - HYPATIAX_OUTPUT_DIR=/tmp/hypatiax_outputs
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - hypatiax-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # JUPYTER NOTEBOOK SERVICE
  # ============================================================================
  
  hypatiax-notebook:
    build:
      context: .
      target: notebook
      args:
        PYTHON_VERSION: 3.12
    image: hypatiax:notebook
    container_name: hypatiax-notebook
    volumes:
      # Mount entire project for notebook access
      - .:/workspace/hypatiax
      - hypatiax-cache-py312:/root/.cache
    environment:
      - HYPATIAX_ENV=docker
      - PYTHONPATH=/workspace/hypatiax
      - HYPATIAX_OUTPUT_DIR=/workspace/hypatiax/outputs
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - "8888:8888"
    networks:
      - hypatiax-network

  # Alternative: Jupyter with Python 3.13
  hypatiax-notebook-py313:
    build:
      context: .
      target: notebook
      args:
        PYTHON_VERSION: 3.13
    image: hypatiax:notebook-py313
    container_name: hypatiax-notebook-py313
    volumes:
      - .:/workspace/hypatiax
      - hypatiax-cache-py313:/root/.cache
    environment:
      - HYPATIAX_ENV=docker
      - PYTHONPATH=/workspace/hypatiax
      - HYPATIAX_OUTPUT_DIR=/workspace/hypatiax/outputs
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - "8889:8888"
    networks:
      - hypatiax-network

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  # Persistent cache for pip packages (speeds up rebuilds)
  hypatiax-cache-py312:
    driver: local
  hypatiax-cache-py313:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  hypatiax-network:
    driver: bridge
