name: Setup Remote venv

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'

jobs:
  setup-venv:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Create venv on remote
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          PYTHON_VER: ${{ github.event.inputs.python_version }}
        run: |
          ssh $REMOTE_USER@$REMOTE_HOST << 'EOF'
            python$PYTHON_VER -m venv ~/venv-${PYTHON_VER//./}
            source ~/venv-${PYTHON_VER//./}/bin/activate
            export TMPDIR=~/tmp_pip
            mkdir -p ~/tmp_pip
            pip install --upgrade pip setuptools wheel
            pip install pip-audit safety
            echo "✓ venv-${PYTHON_VER//./} created"
          EOF
