name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Free up disk space on GitHub Actions runner
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          
          # Remove Docker images we don't need
          docker rmi $(docker images -aq) 2>/dev/null || true
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Validate project structure
        run: |
          echo "Checking project structure..."
          test -f requirements.txt && echo "✓ requirements.txt found" || { echo "❌ requirements.txt missing"; exit 1; }
          test -f Dockerfile && echo "✓ Dockerfile found" || { echo "❌ Dockerfile missing"; exit 1; }
          test -f docker-compose.yml && echo "✓ docker-compose.yml found" || echo "⚠ docker-compose.yml not found"
      
      - name: Install dependencies (minimal for CI)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Install only essential packages for testing (not all dependencies)
          pip install pytest pytest-cov black flake8 mypy
          pip install pip-audit safety
          
          # Install core dependencies only (skip ML/CUDA packages to save space)
          pip install pydantic pyyaml requests flask
      
      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Format check with black
        continue-on-error: true
        run: |
          black --check . || true
      
      - name: Type check with mypy
        continue-on-error: true
        run: |
          mypy . --ignore-missing-imports || true
      
      - name: Security audit with pip-audit
        continue-on-error: true
        run: |
          pip-audit || true
      
      - name: Security check with safety
        continue-on-error: true
        run: |
          safety check || true
      
      - name: Run tests
        if: false  # Disable until test suite is ready
        run: |
          pytest tests/ -v --cov=hypatiax --cov-report=xml
      
      - name: Upload coverage
        if: false  # Disable until tests are ready
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (test only)
        run: |
          docker-compose build hypatiax-py312 --no-cache
      
      - name: Test Docker image
        run: |
          docker-compose run --rm hypatiax-py312 python --version
          docker-compose run --rm hypatiax-py312 pip list | head -20
