name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CRITICAL: Free disk space first
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Validate project structure
        run: |
          echo "✓ Checking project structure..."
          test -f requirements.txt || { echo "❌ requirements.txt missing"; exit 1; }
          test -f Dockerfile || { echo "❌ Dockerfile missing"; exit 1; }
          test -f docker-compose.yml || echo "⚠ docker-compose.yml not found"
          test -f pyproject.toml || echo "⚠ pyproject.toml not found"
          echo "✓ Structure check passed"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            black \
            flake8 \
            pip-audit \
            safety

      - name: Lint with flake8
        continue-on-error: true
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Format check with black
        continue-on-error: true
        run: |
          black --check --diff . || true

      - name: Security audit with pip-audit
        continue-on-error: true
        run: |
          pip-audit --skip-editable || true

      - name: Security check with safety
        continue-on-error: true
        run: |
          safety check --json || true

      - name: Show disk usage
        run: |
          df -h
          du -sh /tmp/* 2>/dev/null | head -10 || true

  docker-build-test:
    runs-on: ubuntu-latest
    needs: lint-and-security
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # Keep Docker for build
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        run: |
          echo "Building development image for Python 3.12..."
          docker-compose build hypatiax-py312 || echo "Build failed, continuing..."

      - name: Show disk usage
        run: df -h
