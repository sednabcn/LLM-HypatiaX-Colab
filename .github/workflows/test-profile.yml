name: Test Specific Profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to test'
        type: choice
        required: true
        options:
          - ner
          - llm
          - agents
          - transformers
          - hybrid
          - evaluation
      modules:
        description: 'Custom modules (optional, overrides profile)'
        required: false
      python_version:
        description: 'Python version'
        type: choice
        options: ['3.12', '3.13']
        default: '3.12'

jobs:
  test-profile:
    name: Test ${{ github.event.inputs.profile }} Profile
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Python ${{ github.event.inputs.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ github.event.inputs.python_version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt || true

    - name: Show profile info
      run: |
        echo "Testing profile: ${{ github.event.inputs.profile }}"
        echo "Python version: ${{ github.event.inputs.python_version }}"

    - name: Run workflow with profile
      run: |
        MODULES="${{ github.event.inputs.modules }}"
        PROFILE="${{ github.event.inputs.profile }}"

        if [ -n "$MODULES" ]; then
          echo "Running custom modules: $MODULES"
          python .github/scripts/workflow_runner.py --base-path . --modules $MODULES
        else
          echo "Running $PROFILE profile"
          python .github/scripts/workflow_runner.py --base-path . --profile $PROFILE
        fi
      continue-on-error: true

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-${{ github.event.inputs.profile }}-results
        path: workflow_reports/
        if-no-files-found: warn
