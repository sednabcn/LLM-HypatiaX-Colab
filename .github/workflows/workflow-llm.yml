name: HypatiaX LLM Workflow

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'tools/**'
      - 'agents/**'
      - 'model_implementations/llm/**'
      - 'experiments/llm/**'
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        type: choice
        options: ['3.12', '3.13']
        default: '3.12'

env:
  WORKFLOW_PROFILE: llm
  WORKFLOW_REPORTS_DIR: workflow_reports

jobs:
  llm-workflow:
    name: LLM Pipeline - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event.inputs.python_version && fromJSON(format('["{0}"]', github.event.inputs.python_version)) || fromJSON('["3.12"]') }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir -r requirements.txt || echo "Requirements installed"
        pip install --no-cache-dir transformers openai anthropic || true

    - name: Run LLM Workflow
      run: |
        python .github/scripts/workflow_runner.py --base-path . --profile llm
      continue-on-error: true
      timeout-minutes: 45
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Generate summary
      if: always()
      run: |
        echo "## 🤖 LLM Workflow Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Profile:** LLM (Large Language Models)" >> $GITHUB_STEP_SUMMARY
        echo "**Python:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Execution Order:** config → datasets → utils → tools → mappings → models → model_implementations → agents → core → experiments → scripts_ → tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "workflow_reports/master_report_*.txt" ]; then
          latest=$(ls -t workflow_reports/master_report_*.txt | head -1)
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 40 "$latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload LLM reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: llm-reports-py${{ matrix.python-version }}
        path: workflow_reports/
        retention-days: 30
        if-no-files-found: warn
