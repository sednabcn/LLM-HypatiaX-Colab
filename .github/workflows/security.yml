name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday
  workflow_dispatch:
    inputs:
      severity_level:
        description: 'Minimum severity to report'
        type: choice
        options: [critical, high, medium, low]
        default: 'high'

jobs:
  # =============================================================================
  # DEPENDENCY SCANNING (OPTIMIZED FOR DISK SPACE)
  # =============================================================================
  scan-dependencies:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # CRITICAL: Free disk space before installing anything
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements-ci.txt
    
    - name: Check disk space
      run: |
        echo "Disk space before installation:"
        df -h
    
    - name: Install security tools only
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pip-audit safety bandit
    
    # DON'T install full requirements - use minimal set
    - name: Install minimal dependencies for scanning
      run: |
        # Only install packages needed for code analysis
        pip install --no-cache-dir \
          pydantic \
          pyyaml \
          requests \
          flask \
          flask-cors==4.0.0
        
        echo "Disk space after minimal install:"
        df -h
    
    - name: Run pip-audit
      continue-on-error: true
      run: |
        # Audit installed packages only (skip full requirements.txt)
        pip-audit --skip-editable --desc --format json > audit-results.json || true
        pip-audit --skip-editable --desc || true
    
    - name: Run safety check
      continue-on-error: true
      run: |
        safety check --json > safety-results.json || true
        safety check || true
    
    - name: Run bandit (code security)
      continue-on-error: true
      run: |
        # Only scan if hypatiax directory exists
        if [ -d "hypatiax" ]; then
          bandit -r hypatiax/ -f json -o bandit-results.json || true
          bandit -r hypatiax/ || true
        else
          echo "hypatiax directory not found, skipping bandit scan"
        fi
    
    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          audit-results.json
          safety-results.json
          bandit-results.json
        retention-days: 90
        if-no-files-found: ignore

  # =============================================================================
  # CODEQL ANALYSIS
  # =============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
        queries: security-and-quality
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:python"

  # =============================================================================
  # DOCKER IMAGE SCANNING (SEPARATED TO SAVE RESOURCES)
  # =============================================================================
  scan-docker:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    # Only run on push to main branches, not PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: false  # Keep Docker
        swap-storage: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build image (production target)
      run: |
        echo "Building production image..."
        docker build --target production -t hypatiax:scan . || {
          echo "Production build failed, trying development target..."
          docker build --target development -t hypatiax:scan .
        }
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'hypatiax:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Clean up
      if: always()
      run: |
        docker rmi hypatiax:scan || true
        docker system prune -f || true
