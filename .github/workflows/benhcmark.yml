# ============================================================================
# GitHub Actions Workflow for HypatiaX Benchmarks
# File: .github/workflows/benchmarks.yml
# ============================================================================

name: 🚀 Performance Benchmarks

on:
  # Run on every push to main
  push:
    branches: [ main, master, develop ]

  # Run on pull requests
  pull_request:
    branches: [ main, master, develop ]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      include_slow:
        description: 'Include slow tests (LLM benchmarks)'
        required: false
        type: boolean
        default: false
      compare_baseline:
        description: 'Compare with baseline'
        required: false
        type: boolean
        default: true

  # Scheduled runs (every day at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

# Only run one benchmark workflow at a time
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: benchmark_results

jobs:
  # ========================================================================
  # Job 1: Run Benchmarks
  # ========================================================================
  run-benchmarks:
    name: 🏃 Run Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark pytest-json-report numpy

      - name: 📥 Download previous benchmark results
        uses: actions/cache@v4
        with:
          path: ${{ env.RESULTS_DIR }}
          key: benchmark-results-${{ github.sha }}
          restore-keys: |
            benchmark-results-

      - name: 🚀 Run benchmarks (fast tests)
        if: ${{ !inputs.include_slow && github.event_name != 'schedule' }}
        run: |
          python tests/benchmarks/run_benchmarks.py \
            --output-dir ${{ env.RESULTS_DIR }} \
            --html-report

      - name: 🐌 Run benchmarks (including slow tests)
        if: ${{ inputs.include_slow || github.event_name == 'schedule' }}
        run: |
          python tests/benchmarks/run_benchmarks.py \
            --include-slow \
            --output-dir ${{ env.RESULTS_DIR }} \
            --html-report

      - name: 📊 Compare with baseline
        if: ${{ inputs.compare_baseline || github.event_name == 'pull_request' }}
        id: comparison
        continue-on-error: true
        run: |
          # Find latest results file
          LATEST_RESULTS=$(ls -t ${{ env.RESULTS_DIR }}/results_*.json | head -n1)

          # Run comparison
          python tests/benchmarks/run_benchmarks.py \
            --compare-baseline \
            --output-dir ${{ env.RESULTS_DIR }}

          # Capture exit code
          echo "comparison_exit_code=$?" >> $GITHUB_OUTPUT

      - name: 📈 Generate summary for PR
        if: github.event_name == 'pull_request'
        run: |
          python .github/scripts/generate_pr_comment.py \
            --results-dir ${{ env.RESULTS_DIR }}

      - name: 💾 Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            ${{ env.RESULTS_DIR }}/results_*.json
            ${{ env.RESULTS_DIR }}/report_*.html
            ${{ env.RESULTS_DIR }}/comparison_*.json
          retention-days: 90

      - name: 📊 Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ${{ env.RESULTS_DIR }}/report_*.html
          retention-days: 30

      - name: ❌ Fail if critical regression
        if: steps.comparison.outputs.comparison_exit_code == '1'
        run: |
          echo "::error::Critical performance regression detected!"
          exit 1

  # ========================================================================
  # Job 2: Publish Results (only on main branch)
  # ========================================================================
  publish-results:
    name: 📤 Publish Results
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: ${{ env.RESULTS_DIR }}

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.RESULTS_DIR }}
          destination_dir: benchmarks
          keep_files: true

      - name: 📊 Update benchmark badge
        run: |
          # Generate badge JSON
          python .github/scripts/generate_badge.py \
            --results-dir ${{ env.RESULTS_DIR }} \
            --output-file badge.json

      - name: 💬 Post to Slack (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python .github/scripts/notify_slack.py \
            --results-dir ${{ env.RESULTS_DIR }}

  # ========================================================================
  # Job 3: Performance Regression Check (PR only)
  # ========================================================================
  regression-check:
    name: 🔍 Regression Check
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📥 Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: ${{ env.RESULTS_DIR }}

      - name: 📝 Generate PR comment
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find latest comparison file
            const resultsDir = '${{ env.RESULTS_DIR }}';
            const files = fs.readdirSync(resultsDir)
              .filter(f => f.startsWith('comparison_'))
              .sort()
              .reverse();

            if (files.length === 0) {
              console.log('No comparison file found');
              return;
            }

            const comparisonFile = path.join(resultsDir, files[0]);
            const comparison = JSON.parse(fs.readFileSync(comparisonFile, 'utf8'));

            // Build comment
            let comment = '## 🚀 Performance Benchmark Results\n\n';
            comment += `**Current**: ${comparison.current_timestamp}\n`;
            comment += `**Baseline**: ${comparison.baseline_timestamp}\n\n`;

            // Summary table
            comment += '### 📊 Component Summary\n\n';
            comment += '| Component | Change | Baseline | Current | Status |\n';
            comment += '|-----------|--------|----------|---------|--------|\n';

            for (const [component, data] of Object.entries(comparison.components)) {
              const icon = data.improved ? '✅' : data.regressed ? '❌' : '➡️';
              const change = data.change_percent.toFixed(1);
              const status = data.improved ? 'Improved' : data.regressed ? 'Regressed' : 'Stable';
              comment += `| ${component} | ${change}% | ${data.baseline.toFixed(2)}s | ${data.current.toFixed(2)}s | ${icon} ${status} |\n`;
            }

            // Regressions
            if (comparison.regressions.length > 0) {
              comment += '\n### ❌ Performance Regressions\n\n';
              for (const reg of comparison.regressions) {
                const icon = reg.severity === 'critical' ? '🔴' : reg.severity === 'high' ? '🟠' : '🟡';
                comment += `- ${icon} **${reg.component}**: +${reg.change_percent.toFixed(1)}% slower\n`;
              }
            }

            // Improvements
            if (comparison.improvements.length > 0) {
              comment += '\n### ✅ Performance Improvements\n\n';
              for (const imp of comparison.improvements) {
                comment += `- ⚡ **${imp.component}**: ${imp.change_percent.toFixed(1)}% faster\n`;
              }
            }

            // Overall change
            const overall = comparison.overall_change;
            const overallIcon = overall < -5 ? '✅' : overall > 10 ? '❌' : '➡️';
            comment += `\n### ${overallIcon} Overall Change: ${overall >= 0 ? '+' : ''}${overall.toFixed(1)}%\n`;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: ⚠️ Fail PR if critical regression
        run: |
          LATEST_COMPARISON=$(ls -t ${{ env.RESULTS_DIR }}/comparison_*.json | head -n1)
          CRITICAL=$(jq '[.regressions[] | select(.severity == "critical")] | length' $LATEST_COMPARISON)

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical performance regression(s) detected!"
            exit 1
          fi
