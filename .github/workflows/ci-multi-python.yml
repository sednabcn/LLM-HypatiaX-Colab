name: HypatiaX Multi-Python CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        include:
          - python-version: '3.12'
            requirements-file: 'requirements-py312.txt'
            label: 'Colab-like'
           - python-version: '3.13'
            requirements-file: 'requirements.txt'
            label: 'Latest'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ matrix.requirements-file }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f "${{ matrix.requirements-file }}" ]; then
          pip install -r ${{ matrix.requirements-file }}
        else
          pip install spacy torch transformers pandas numpy
        fi
    
    - name: Download spaCy models
      run: |
        python -m spacy download en_core_web_sm
    
    - name: Install package
      run: |
        pip install -e . || echo "Package installation optional"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short || echo "Tests incomplete"
    
    - name: Verify environment (${{ matrix.label }})
      run: |
        echo "=========================================="
        echo "Python ${{ matrix.python-version }} - ${{ matrix.label }}"
        echo "=========================================="
        python --version
        python -c "import spacy; print(f'✅ spaCy: {spacy.__version__}')"
        python -c "import torch; print(f'✅ PyTorch: {torch.__version__}')"
        python -c "import transformers; print(f'✅ Transformers: {transformers.__version__}')"
        python -c "import pandas; print(f'✅ Pandas: {pandas.__version__}')"
        python -c "import numpy; print(f'✅ NumPy: {numpy.__version__}')"
        python -c "import hypatiax; print('✅ HypatiaX installed')" || echo "⚠️  HypatiaX not installed"

  compare-environments:
    name: Environment Comparison Report
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate comparison
      run: |
        echo "## Python Environment Comparison" > comparison.md
        echo "" >> comparison.md
        echo "| Python Version | Label | Requirements File |" >> comparison.md
        echo "|---|---|---|" >> comparison.md
        echo "| 3.12 | Colab-like | requirements-py310.txt |" >> comparison.md
        echo "| 3.13 | Latest | requirements.txt |" >> comparison.md
    - uses: actions/upload-artifact@v4
      with:
        name: environment-comparison
        path: comparison.md
