# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master", "main", "features/*"]
  pull_request:
    branches: [ "master", "main", "features/*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        os: [ubuntu-latest]
 
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
           python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip
           pip install pytest
      - name: Add other actions to build, test, and deploy your project
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."

      - name: Run unit tests
        run: pytest -m unit --junitxml=junit/unit-test-results.xml

      - name: Run integration tests
        run: pytest -m integration --junitxml=junit/integration-test-results.xml

      - name: Run functional tests
        run: pytest -m functional --junitxml=junit/functional-test-results.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: junit/unit-test-results.xml

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: junit/integration-test-results.xml

      - name: Upload functional test results
        uses: actions/upload-artifact@v3
        with:
          name: functional-test-results
          path: junit/functional-test-results.xml
          
      - name: Run tests
        run: |
            pytest --junitxml=junit/test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
           name: test-results
           path: junit/test-results.xml
      
       
