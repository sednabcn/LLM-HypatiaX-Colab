# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        # Only run on staged files, skip broken ones
        exclude: |
          (?x)^(
              .*workflow_ner_runner\.py|
              .*defi_schemas\.py|
              .*api_test_examples\.py|
              .*llm_prep\.py|
              .*run_time_code_seq\.py|
              .*training_spacy\.py|
              .*defi_30_formulas_generator\.py|
              .*risk_150_formulas_generator\.py
          )$
