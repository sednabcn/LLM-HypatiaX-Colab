name: Documentation

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'docs/**'
      - 'hypatiax/**/*.py'
      - 'README*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git info
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material mkdocstrings[python] \
                      mkdocs-git-revision-date-localized-plugin \
                      mkdocs-minify-plugin \
                      mkdocs-redirects \
                      pymdown-extensions \
                      sphinx sphinx-rtd-theme sphinx-autodoc-typehints \
                      pdoc3
      
      - name: Generate API documentation with pdoc
        run: |
          mkdir -p docs/api
          pdoc --html --output-dir docs/api hypatiax --force
      
      - name: Generate Sphinx documentation
        run: |
          if [ -f "docs/conf.py" ]; then
            cd docs
            sphinx-apidoc -o source/ ../hypatiax
            make html
            cd ..
          fi
      
      - name: Build MkDocs site
        run: |
          if [ -f "mkdocs.yml" ]; then
            mkdocs build --strict
          else
            echo "Creating default mkdocs.yml"
            cat > mkdocs.yml << 'MKDOCS'
          site_name: HypatiaX Documentation
          site_description: AI-powered academic analysis system
          site_author: HypatiaX Team
          
          theme:
            name: material
            palette:
              - scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
            features:
              - navigation.instant
              - navigation.tracking
              - navigation.tabs
              - navigation.sections
              - navigation.expand
              - navigation.top
              - search.suggest
              - search.highlight
              - content.code.copy
              - content.code.annotate
          
          markdown_extensions:
            - pymdownx.highlight:
                anchor_linenums: true
            - pymdownx.inlinehilite
            - pymdownx.snippets
            - pymdownx.superfences
            - pymdownx.tabbed:
                alternate_style: true
            - admonition
            - pymdownx.details
            - attr_list
            - md_in_html
            - tables
            - toc:
                permalink: true
          
          plugins:
            - search
            - git-revision-date-localized:
                enable_creation_date: true
            - minify:
                minify_html: true
          
          nav:
            - Home: index.md
            - Getting Started:
              - Installation: getting-started/installation.md
              - Quick Start: getting-started/quickstart.md
              - Configuration: getting-started/configuration.md
            - User Guide:
              - Overview: guide/overview.md
              - API Usage: guide/api.md
              - CLI Usage: guide/cli.md
            - API Reference: api/
            - Development:
              - Contributing: development/contributing.md
              - Architecture: development/architecture.md
              - Testing: development/testing.md
            - Changelog: changelog.md
          MKDOCS
            
            # Create basic documentation structure
            mkdir -p docs/{getting-started,guide,development}
            
            # Index page
            cat > docs/index.md << 'INDEX'
          # HypatiaX Documentation
          
          Welcome to the HypatiaX documentation!
          
          ## What is HypatiaX?
          
          HypatiaX is an AI-powered academic analysis system designed to help researchers and students analyze academic papers, extract insights, and generate comprehensive reports.
          
          ## Features
          
          - 🔍 Advanced paper analysis
          - 📊 Citation network analysis
          - 🤖 AI-powered insights
          - 📈 Visualization tools
          - 🔗 Integration with academic databases
          
          ## Quick Links
          
          - [Installation Guide](getting-started/installation.md)
          - [Quick Start](getting-started/quickstart.md)
          - [API Reference](api/)
          - [Contributing](development/contributing.md)
          INDEX
            
            mkdocs build --strict
          fi
      
      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          coverage-badge -o docs/coverage.svg || echo "No coverage data"
      
      - name: Check documentation links
        run: |
          pip install linkchecker
          linkchecker site/ --check-extern || true
      
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            site/
            docs/_build/html/
            docs/api/
          retention-days: 30
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: docs.hypatiax.dev  # Optional: your custom domain
      
      - name: Comment PR with documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = `## 📚 Documentation Preview
            
            Documentation has been built successfully!
            
            You can download the artifacts to preview the changes locally.
            
            ### Build Summary
            - MkDocs site: ✅ Built
            - API docs: ✅ Generated
            - Links checked: ✅ Validated
            
            Once merged, documentation will be automatically deployed to GitHub Pages.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  check-spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v5
        with:
          files: |
            **/*.md
            **/*.py
          config: .cspell.json
          incremental_files_only: false
        continue-on-error: true

  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'
        continue-on-error: true
