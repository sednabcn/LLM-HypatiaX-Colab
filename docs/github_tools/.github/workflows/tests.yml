# .github/workflows/tests.yml
name: Tests

on:
  # ONLY on pull requests when ready (not draft)
  pull_request:
    types: [opened, synchronize, ready_for_review]

  # Once per week - Sunday at 2 AM
  schedule:
    - cron: '0 2 * * 0'  # Weekly only

jobs:
  quick-tests:
    # Only for PRs, skip if draft
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Run ONLY 5 critical tests
      - name: Quick Smoke Test
        run: |
          python run_tests.py --quick-only

  weekly-full:
    # Only on Sunday schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Run all tests once per week
      - name: Full Test Suite
        run: |
          python run_tests.py --all
