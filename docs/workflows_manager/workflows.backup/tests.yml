name: Run HypatiaX Tests

on:
  workflow_dispatch:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/setup.py', '**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install pytest pytest-cov || echo "Installing pytest"
          python -m spacy download en_core_web_sm

      - name: Security scan
        run: |
          pip install pip-audit safety
          pip-audit || true
          safety check || true

      - name: Setup HypatiaX environment
        run: |
          chmod +x setup_environment.sh
          ./setup_environment.sh

      - name: Display configuration
        run: |
          python -c "from hypatiax.config import config; config.print_config()"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=hypatiax --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

      - name: Upload test outputs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-outputs
          path: ci_outputs/
          retention-days: 7
