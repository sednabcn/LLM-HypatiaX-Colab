# ============================================
# WORKFLOW: Tableau Pattern Generation
# ============================================
# Save as: .github/workflows/tableau-patterns.yml

name: Tableau Pattern Generation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'hypatiax/patterns/queries/tableau/**'
      - 'hypatiax/datasets/queries/tableau/**'
      - 'hypatiax/utils/utils.py'
      - '.github/workflows/tableau-patterns.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pattern_type:
        description: 'Pattern type to generate'
        required: true
        type: choice
        options:
          - desc
          - formulas
          - both
        default: 'both'
      indicator:
        description: 'Stopword indicator'
        required: true
        type: choice
        options:
          - S
          - F
          - B
        default: 'B'
      debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=deps-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            deps-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov openpyxl

      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm

      - name: Validate project structure
        run: |
          echo "Validating directory structure..."
          test -f hypatiax/patterns/queries/tableau/test_create_ruler_tableau.py || exit 1
          test -f hypatiax/patterns/queries/tableau/generation.py || exit 1
          test -f hypatiax/utils/utils.py || exit 1
          echo "✓ All required files exist"

      - name: Check data files
        run: |
          if [ -f hypatiax/datasets/queries/tableau/training/formulas.xlsx ]; then
            echo "✓ Training data found"
          else
            echo "⚠️  Warning: Training data not found"
          fi

  test-pattern-generation:
    name: Test Pattern Generation
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        pattern_type: [desc, formulas, both]
        indicator: [S, F, B]
        exclude:
          # Optimize matrix - avoid redundant combinations
          - pattern_type: desc
            indicator: F
          - pattern_type: formulas
            indicator: S

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl pandas spacy nltk
          python -m spacy download en_core_web_sm

      - name: Run pattern generation test
        id: test
        run: |
          cd hypatiax/patterns/queries/tableau
          python test_create_ruler_tableau.py \
            ${{ matrix.pattern_type }} \
            --indicator ${{ matrix.indicator }} \
            --output output_${{ matrix.pattern_type }}_${{ matrix.indicator }}.json \
            ${{ github.event.inputs.debug == 'true' && '--debug' || '' }}
        continue-on-error: true

      - name: Check test result
        run: |
          if [ ${{ steps.test.outcome }} == 'success' ]; then
            echo "✅ Test passed: ${{ matrix.pattern_type }} with indicator ${{ matrix.indicator }}"
          else
            echo "❌ Test failed: ${{ matrix.pattern_type }} with indicator ${{ matrix.indicator }}"
          fi

      - name: Upload generated patterns
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patterns-${{ matrix.pattern_type }}-${{ matrix.indicator }}
          path: |
            hypatiax/patterns/queries/tableau/output_*.json
            hypatiax/patterns/queries/tableau/*.log
          retention-days: 30

  generate-custom:
    name: Generate Custom Patterns
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl pandas spacy nltk
          python -m spacy download en_core_web_sm

      - name: Generate patterns with custom parameters
        run: |
          cd hypatiax/patterns/queries/tableau
          python test_create_ruler_tableau.py \
            ${{ github.event.inputs.pattern_type }} \
            --indicator ${{ github.event.inputs.indicator }} \
            --output custom_output_${{ github.event.inputs.pattern_type }}.json \
            ${{ github.event.inputs.debug == 'true' && '--debug' || '' }}

      - name: Upload custom patterns
        uses: actions/upload-artifact@v4
        with:
          name: custom-patterns-${{ github.run_number }}
          path: |
            hypatiax/patterns/queries/tableau/custom_output_*.json
          retention-days: 90

  validate-outputs:
    name: Validate Generated Patterns
    runs-on: ubuntu-latest
    needs: test-pattern-generation
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List generated patterns
        run: |
          echo "Generated pattern files:"
          find artifacts/ -name "*.json" -type f

      - name: Validate JSON structure
        run: |
          for file in artifacts/*/output_*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              python -m json.tool "$file" > /dev/null && echo "✓ Valid JSON" || echo "✗ Invalid JSON"
            fi
          done

      - name: Generate summary report
        run: |
          echo "## Pattern Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pattern Type | Indicator | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          for dir in artifacts/patterns-*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              if [ -f "$dir/output_*.json" ]; then
                echo "| ${name#patterns-} | ✅ Success |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| ${name#patterns-} | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test-pattern-generation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl pandas spacy nltk pytest
          python -m spacy download en_core_web_sm

      - name: Run integration tests
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ -v --tb=short
          else
            echo "No integration tests found"
          fi

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test-pattern-generation, validate-outputs, integration-test]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.test-pattern-generation.result }}" == "success" ]; then
            echo "✅ Pattern generation completed successfully"
            echo "status=success" >> $GITHUB_ENV
          else
            echo "❌ Pattern generation encountered errors"
            echo "status=failure" >> $GITHUB_ENV
          fi

      - name: Create issue on failure
        if: env.status == 'failure' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🐛 Pattern Generation Failed',
              body: `Pattern generation workflow failed on ${context.ref}

              Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

              Please investigate and fix the issues.`,
              labels: ['bug', 'automated']
            })

---
# ============================================
# WORKFLOW: Fix TypeError Issues
# ============================================
# Save as: .github/workflows/fix-utils.yml

name: Fix Utils TypeError

on:
  workflow_dispatch:
  push:
    paths:
      - 'hypatiax/utils/utils.py'

jobs:
  validate-utils-fix:
    name: Validate Utils Type Handling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas nltk openpyxl pytest

      - name: Create test for preproc_ent function
        run: |
          cat > test_utils_fix.py << 'EOF'
          import pandas as pd
          from nltk.tokenize import wordpunct_tokenize

          def test_preproc_ent_with_mixed_types():
              """Test that preproc_ent handles mixed data types"""
              # Simulate data with mixed types
              df = pd.DataFrame({
                  'col1': ['text data', 123, 'more text'],
                  'col2': [456, 'string', 789.0]
              })

              # Convert all to strings (this is what should happen in preproc_ent)
              df = df.astype(str)

              # Test tokenization
              result = df.apply(lambda x: [wordpunct_tokenize(y) for y in x])

              print("✅ Test passed: Mixed types handled correctly")
              return True

          if __name__ == '__main__':
              test_preproc_ent_with_mixed_types()
          EOF

          python test_utils_fix.py

      - name: Suggest fix for utils.py
        run: |
          echo "## Suggested Fix for utils.py" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "In \`hypatiax/utils/utils.py\`, line 679:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```python' >> $GITHUB_STEP_SUMMARY
          echo '# BEFORE (causes TypeError):' >> $GITHUB_STEP_SUMMARY
          echo 'dg_tok = df.apply(lambda x: [wordpunct_tokenize(y) for y in x])' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '# AFTER (fixed):' >> $GITHUB_STEP_SUMMARY
          echo 'df = df.astype(str)  # Convert all values to strings first' >> $GITHUB_STEP_SUMMARY
          echo 'dg_tok = df.apply(lambda x: [wordpunct_tokenize(str(y)) for y in x])' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

---
# ============================================
# COMBINED WORKFLOW: Complete Test Suite
# ============================================
# Save as: .github/workflows/tableau-complete.yml

name: Tableau Complete Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM
  workflow_dispatch:

jobs:
  setup-environment:
    name: Setup Test Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl pandas spacy nltk pytest pytest-cov
          python -m spacy download en_core_web_sm
          python -m nltk.downloader punkt wordnet

      - name: Run complete test
        run: |
          cd hypatiax/patterns/queries/tableau

          # Test all combinations
          for type in desc formulas both; do
            for ind in S F B; do
              echo "Testing: type=$type, indicator=$ind"
              python test_create_ruler_tableau.py $type --indicator $ind \
                --output "output_${type}_${ind}.json" || echo "Failed: $type/$ind"
            done
          done

      - name: Upload all results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-test-results
          path: hypatiax/patterns/queries/tableau/output_*.json
          retention-days: 30
