name: Build and Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  # Universal environment variables for all jobs
  HYPATIAX_ROOT: ${{ github.workspace }}
  PYTHONPATH: ${{ github.workspace }}
  HYPATIAX_OUTPUT_DIR: ${{ github.workspace }}/ci_outputs

jobs:
  # ==========================================================================
  # ENVIRONMENT SETUP & VALIDATION
  # ==========================================================================

  setup-and-validate:
    name: Setup & Validate Environment
    runs-on: ubuntu-latest

    outputs:
      project_root: ${{ steps.setup.outputs.project_root }}
      environment: ${{ steps.setup.outputs.environment }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup HypatiaX environment
      id: setup
      run: |
        # Make setup script executable
        chmod +x setup_environment.sh

        # Run setup (detects GitHub Actions automatically)
        ./setup_environment.sh

        # Set outputs for other jobs
        echo "project_root=${{ github.workspace }}" >> $GITHUB_OUTPUT
        echo "environment=github" >> $GITHUB_OUTPUT

    - name: ✅ Validate project structure
      run: |
        echo "=== Project Structure Validation ==="

        # Check critical directories
        test -d hypatiax || { echo "❌ hypatiax/ not found"; exit 1; }
        test -d hypatiax/datasets || { echo "❌ hypatiax/datasets/ not found"; exit 1; }
        test -d hypatiax/data_spacy || { echo "❌ hypatiax/data_spacy/ not found"; exit 1; }

        # Check config module
        test -f hypatiax/config.py || { echo "❌ config.py not found"; exit 1; }

        echo "✅ All critical paths exist"

        # Display structure
        echo ""
        echo "=== Directory Tree ==="
        tree -L 2 -d hypatiax/ || ls -R hypatiax/

    - name: 📊 Display configuration
      run: |
        echo "=== Environment Variables ==="
        echo "HYPATIAX_ROOT: $HYPATIAX_ROOT"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "HYPATIAX_OUTPUT_DIR: $HYPATIAX_OUTPUT_DIR"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

  # ==========================================================================
  # BUILD
  # ==========================================================================

  build:
    name: Build Distribution
    needs: setup-and-validate
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: 🔨 Build distribution
      run: python -m build

    - name: 📋 Verify build outputs
      run: |
        echo "=== Build Artifacts ==="
        ls -lh dist/
        echo ""
        echo "=== Wheel Files ==="
        ls -lh dist/*.whl || echo "No wheel files found"
        echo ""
        echo "=== Source Distributions ==="
        ls -lh dist/*.tar.gz || echo "No source distributions found"
        echo ""

        # Validate at least one artifact exists
        if [ ! -f dist/*.whl ] && [ ! -f dist/*.tar.gz ]; then
          echo "❌ No build artifacts found!"
          exit 1
        fi

        echo "✅ Build artifacts validated"

    - name: 💾 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 30

  # ==========================================================================
  # TEST - WHEEL INSTALLATION
  # ==========================================================================

  test:
    name: Test Python ${{ matrix.python-version }} (Wheel)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    env:
      HYPATIAX_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      HYPATIAX_OUTPUT_DIR: ${{ github.workspace }}/ci_outputs

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

        # Determine version-specific requirements file
        PYVERSION=$(python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
        REQ_FILE="requirements-py${PYVERSION}.txt"

        echo "Looking for requirements file: $REQ_FILE"
        if [ -f "$REQ_FILE" ]; then
          echo "Installing from $REQ_FILE"
          pip install -r "$REQ_FILE"
        else
          echo "⚠️  $REQ_FILE not found"
          # Fallback to generic requirements if exists
          if [ -f "requirements.txt" ]; then
            echo "Installing from requirements.txt"
            pip install -r requirements.txt
          fi
        fi

    - name: 📦 Install package from wheel
      run: |
        WHEEL_FILE=$(ls dist/*.whl | head -n 1)
        if [ -z "$WHEEL_FILE" ]; then
          echo "❌ No wheel file found"
          exit 1
        fi
        echo "Installing wheel: $WHEEL_FILE"
        pip install "$WHEEL_FILE"

    - name: ✅ Verify installation and configuration
      run: |
        echo "=== Installation Verification ==="
        python -c "import hypatiax; print(f'✅ Package version: {hypatiax.__version__}')"

        echo ""
        echo "=== Environment Configuration ==="
        echo "HYPATIAX_ROOT: $HYPATIAX_ROOT"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "HYPATIAX_OUTPUT_DIR: $HYPATIAX_OUTPUT_DIR"

        echo ""
        echo "=== PathConfig Validation ==="
        python -c "from hypatiax.config import config; config.print_config()"

        echo ""
        echo "=== Verifying Paths Exist ==="
        python -c "
from hypatiax.config import config
import sys

errors = []
if not config.hypatiax.exists():
    errors.append(f'hypatiax directory not found: {config.hypatiax}')
if not config.datasets.exists():
    errors.append(f'datasets directory not found: {config.datasets}')
if not config.data_spacy.exists():
    errors.append(f'data_spacy directory not found: {config.data_spacy}')

if errors:
    print('❌ Path validation failed:')
    for err in errors:
        print(f'  - {err}')
    sys.exit(1)
else:
    print('✅ All paths validated successfully')
"
    # Add after "Install package from wheel"
    - name: Run entity tests
      run: |
        python -c "from hypatiax.config import config; config.print_config()"
        [ -f "tests/test_entity_desc.py" ] && python tests/test_entity_desc.py
        [ -f "tests/test_entity_formulas.py" ] && python tests/test_entity_formulas.py

    - name: 🧪 Run tests with test runner
      run: |
        # Create outputs directory
        mkdir -p "$HYPATIAX_OUTPUT_DIR"

        if [ -f "test_runner_multi.py" ]; then
          echo "📝 Using test_runner_multi.py for comprehensive testing"
          python test_runner_multi.py -v -t 300 -d ./hypatiax -d ./tests
        elif [ -d "tests" ]; then
          echo "📝 Using pytest for testing"
          python -m pytest tests/ -v --cov=hypatiax --cov-report=term-missing --cov-report=xml
        else
          echo "⚠️  No test runner or tests directory found"
          echo "Running basic import test only"
          python -c "import hypatiax; print('Basic import test passed')"
        fi

    - name: 🧪 Run specific entity tests
      run: |
        if [ -f "tests/test_entity_desc.py" ]; then
          echo "Running test_entity_desc.py..."
          python tests/test_entity_desc.py
        fi

        if [ -f "tests/test_entity_formulas.py" ]; then
          echo "Running test_entity_formulas.py..."
          python tests/test_entity_formulas.py
        fi

    - name: 💾 Upload test outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-wheel-py${{ matrix.python-version }}
        path: |
          ci_outputs/
          outputs/
        retention-days: 7
        if-no-files-found: ignore

    - name: 📊 Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-wheel-py${{ matrix.python-version }}
        path: |
          .coverage
          coverage.xml
        retention-days: 30
        if-no-files-found: ignore

  # ==========================================================================
  # TEST - EDITABLE INSTALLATION
  # ==========================================================================

  test-editable:
    name: Test Python ${{ matrix.python-version }} (Editable)
    needs: setup-and-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    env:
      HYPATIAX_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      HYPATIAX_OUTPUT_DIR: ${{ github.workspace }}/ci_outputs

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

        # Install version-specific requirements
        PYVERSION=$(python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
        REQ_FILE="requirements-py${PYVERSION}.txt"

        if [ -f "$REQ_FILE" ]; then
          echo "Installing from $REQ_FILE"
          pip install -r "$REQ_FILE"
        elif [ -f "requirements.txt" ]; then
          echo "Installing from requirements.txt"
          pip install -r requirements.txt
        fi

    - name: 📦 Install package in editable mode
      run: |
        echo "Installing in editable mode..."
        pip install -e .
        echo "✅ Editable installation complete"

    - name: ✅ Verify configuration
      run: |
        echo "=== Environment Configuration ==="
        python -c "from hypatiax.config import config; config.print_config()"

    - name: 🧪 Run tests
      run: |
        mkdir -p "$HYPATIAX_OUTPUT_DIR"

        if [ -f "test_runner_multi.py" ]; then
          echo "Using test_runner_multi.py"
          python test_runner_multi.py -v -t 300 -d ./hypatiax -d ./tests
        elif [ -d "tests" ]; then
          echo "Using pytest"
          python -m pytest tests/ -v --cov=hypatiax
        fi

    - name: 🧪 Run specific entity tests
      run: |
        if [ -f "tests/test_entity_desc.py" ]; then
          python tests/test_entity_desc.py
        fi
        if [ -f "tests/test_entity_formulas.py" ]; then
          python tests/test_entity_formulas.py
        fi

    - name: 💾 Upload test outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-editable-py${{ matrix.python-version }}
        path: |
          ci_outputs/
          outputs/
        retention-days: 7
        if-no-files-found: ignore

  # ==========================================================================
  # TEST - SOURCE DISTRIBUTION
  # ==========================================================================

  test-sdist:
    name: Test Source Distribution
    needs: build
    runs-on: ubuntu-latest

    env:
      HYPATIAX_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: 📦 Install from source distribution
      run: |
        SDIST_FILE=$(ls dist/*.tar.gz | head -n 1)
        if [ -z "$SDIST_FILE" ]; then
          echo "❌ No source distribution found"
          exit 1
        fi
        echo "Installing from: $SDIST_FILE"
        pip install "$SDIST_FILE"

    - name: ✅ Verify installation
      run: |
        python -c "import hypatiax; print(f'✅ Source distribution install successful: {hypatiax.__version__}')"
        python -c "from hypatiax.config import config; print(f'✅ Config module accessible')"

  # ==========================================================================
  # INTEGRATION TESTS
  # ==========================================================================

  integration-tests:
    name: Integration Tests
    needs: [build, test]
    runs-on: ubuntu-latest

    env:
      HYPATIAX_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      HYPATIAX_OUTPUT_DIR: ${{ github.workspace }}/ci_outputs

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install package
      run: |
        pip install -e .
        pip install pytest

    - name: 🔗 Run integration tests
      run: |
        echo "=== Running Integration Tests ==="

        # Test 1: Config module from anywhere
        cd /tmp
        python -c "from hypatiax.config import config; assert config.root.exists()"
        echo "✅ Test 1: Config accessible from any directory"

        # Test 2: File loading
        cd "$GITHUB_WORKSPACE"
        python -c "
from hypatiax.utils.files import FilesManager
# Test FilesManager initialization
fm = FilesManager('datasets', 'queries', 'tableau', 'training')
print('✅ Test 2: FilesManager initialization')
"

        # Test 3: Entity processing (if test files exist)
        if [ -f "tests/test_entity_desc.py" ]; then
          python tests/test_entity_desc.py
          echo "✅ Test 3: Entity description processing"
        fi

        if [ -f "tests/test_entity_formulas.py" ]; then
          python tests/test_entity_formulas.py
          echo "✅ Test 4: Entity formulas processing"
        fi

        echo ""
        echo "✅ All integration tests passed"

  # ==========================================================================
  # PUBLISH TO TEST PYPI
  # ==========================================================================

  publish-test-pypi:
    name: Publish to Test PyPI
    needs: [build, test, test-editable, test-sdist, integration-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/hypatiax

    permissions:
      id-token: write

    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: 🚀 Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  # ==========================================================================
  # PUBLISH TO PYPI
  # ==========================================================================

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test, test-editable, test-sdist, integration-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/hypatiax

    permissions:
      id-token: write

    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: 🚀 Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  # ==========================================================================
  # SUMMARY
  # ==========================================================================

  summary:
    name: Test Summary
    needs: [setup-and-validate, build, test, test-editable, test-sdist, integration-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: 📋 Generate summary
      run: |
        echo "# HypatiaX CI/CD Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Environment Setup: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tests: Check individual jobs for details" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Tested Configurations" >> $GITHUB_STEP_SUMMARY
        echo "- Python 3.12 (wheel + editable)" >> $GITHUB_STEP_SUMMARY
        echo "- Python 3.13 (wheel + editable)" >> $GITHUB_STEP_SUMMARY
        echo "- Source distribution (3.12)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Environment" >> $GITHUB_STEP_SUMMARY
        echo "- Project Root: \`${{ github.workspace }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: GitHub Actions" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed results in individual job logs." >> $GITHUB_STEP_SUMMARY
