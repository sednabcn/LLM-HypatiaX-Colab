name: Run Python with Security Check

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Security scan
        run: |
          pip install pip-audit
          pip-audit

      - name: Run script
        run: python main.py
