# ============================================
# WORKFLOW 1: CI - Continuous Integration
# ============================================
# Save as: .github/workflows/ci.yml

name: CI - Tests and Validation

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: Run black
        run: black --check script.py
        continue-on-error: true

      - name: Run flake8
        run: flake8 script.py --max-line-length=100
        continue-on-error: true

      - name: Run pylint
        run: pylint script.py --disable=C0111,R0913
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  validate-paths:
    name: Validate Project Paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate directory structure
        run: |
          python script.py --validate-only
        env:
          PROJECT_ROOT: ${{ github.workspace }}

      - name: Check required files exist
        run: |
          test -d hypatiax/datasets/queries/tableau/testing || exit 1
          echo "✓ All required paths exist"

---
# ============================================
# WORKFLOW 2: Process Data - Main Pipeline
# ============================================
# Save as: .github/workflows/process-data.yml

name: Process Data Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'hypatiax/datasets/**'
      - 'script.py'
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Target directory to process'
        required: false
        default: 'hypatiax/datasets/queries/tableau/testing'
      log_level:
        description: 'Logging level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR

jobs:
  process:
    name: Process Tableau Testing Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data processing
        id: process
        run: |
          python script.py
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          TARGET_PATH: ${{ github.event.inputs.target_path || 'hypatiax/datasets/queries/tableau/testing' }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}

      - name: Upload processing results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processing-results-${{ github.run_number }}
          path: |
            logs/
            output/
          retention-days: 30

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: process
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.process.result }}" == "success" ]; then
            echo "✅ Processing completed successfully"
          else
            echo "❌ Processing failed"
            exit 1
          fi

---
# ============================================
# WORKFLOW 3: Scheduled Processing
# ============================================
# Save as: .github/workflows/scheduled.yml

name: Scheduled Data Processing

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly on Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  scheduled-process:
    name: Scheduled Processing Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scheduled processing
        run: |
          echo "Starting scheduled processing at $(date)"
          python script.py
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          LOG_LEVEL: INFO

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-results-${{ github.run_number }}
          path: |
            logs/
            output/
          retention-days: 14

---
# ============================================
# WORKFLOW 4: Deploy to GitHub Pages
# ============================================
# Save as: .github/workflows/deploy-pages.yml

name: Deploy Results to GitHub Pages

on:
  workflow_run:
    workflows: ["Process Data Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: processing-results-${{ github.run_number }}
          path: ./public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

---
# ============================================
# WORKFLOW 5: Release Management
# ============================================
# Save as: .github/workflows/release.yml

name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run final tests
        run: |
          python script.py --validate-only

      - name: Create package
        run: |
          mkdir -p dist
          cp script.py dist/
          cp -r hypatiax dist/ 2>/dev/null || true
          tar -czf hypatia-${{ github.ref_name }}.tar.gz dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: hypatia-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

---
# ============================================
# WORKFLOW 6: Performance Monitoring
# ============================================
# Save as: .github/workflows/performance.yml

name: Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install memory-profiler pytest-benchmark

      - name: Run benchmarks
        run: |
          python -m memory_profiler script.py
          pytest benchmarks/ --benchmark-only
        env:
          PROJECT_ROOT: ${{ github.workspace }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            .benchmarks/
            *.prof

---
# ============================================
# WORKFLOW 7: Security Scanning
# ============================================
# Save as: .github/workflows/security.yml

name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  code-scanning:
    name: Code Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

---
# ============================================
# WORKFLOW 8: Cleanup Old Artifacts
# ============================================
# Save as: .github/workflows/cleanup.yml

name: Cleanup Old Artifacts

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete Old Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '30 days'
          skip-recent: 5

---
# ============================================
# WORKFLOW 9: Multi-Environment Deployment
# ============================================
# Save as: .github/workflows/deploy-env.yml

name: Multi-Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      run_tests:
        description: 'Run tests before deployment'
        required: false
        type: boolean
        default: true

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'development'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        if: github.event.inputs.run_tests == 'true'
        run: |
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Deploy to development
        run: |
          python script.py
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          ENVIRONMENT: development

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        if: github.event.inputs.run_tests == 'true'
        run: |
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Deploy to staging
        run: |
          python script.py
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          ENVIRONMENT: staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        if: github.event.inputs.run_tests == 'true'
        run: |
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Deploy to production
        run: |
          python script.py
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          ENVIRONMENT: production

      - name: Create deployment tag
        run: |
          git tag -a "deploy-prod-$(date +'%Y%m%d-%H%M%S')" -m "Production deployment"
          git push origin --tags
