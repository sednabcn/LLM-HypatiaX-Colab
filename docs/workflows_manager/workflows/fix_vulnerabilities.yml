name: Fix Python Security Vulnerabilities

on:
  # Run on schedule (weekly)
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      severity_level:
        description: 'Fix severity level'
        required: true
        default: 'high'
        type: choice
        options:
          - critical
          - high
          - all
      create_pr:
        description: 'Create Pull Request with fixes'
        required: true
        default: true
        type: boolean
      #      deploy_to_remote:
      #        description: 'Deploy fixes to remote server'
      #        required: true
      #        default: false
      #        type: boolean

  # Run on pull requests to main
  pull_request:
    branches: [ main, master ]
    paths:
      - 'requirements.txt'
      - 'requirements/*.txt'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scan-vulnerabilities:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.scan.outputs.has_vulnerabilities }}
      vulnerability_count: ${{ steps.scan.outputs.count }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi

      - name: Run pip-audit scan
        id: scan
        continue-on-error: true
        run: |
          echo "Running security scan..."
          pip-audit --desc --format json > audit-results.json || true
          
          # Check if vulnerabilities exist
          if [ -s audit-results.json ]; then
            COUNT=$(jq '. | length' audit-results.json || echo "0")
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT vulnerabilities"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Run safety check
        continue-on-error: true
        run: |
          safety check --json > safety-results.json || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            audit-results.json
            safety-results.json

      - name: Create issue for vulnerabilities
        if: steps.scan.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditResults = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            
            let body = '## 🚨 Security Vulnerabilities Detected\n\n';
            body += `Found **${auditResults.length}** vulnerabilities in Python dependencies.\n\n`;
            body += '### Summary\n\n';
            
            const bySeverity = {};
            auditResults.forEach(vuln => {
              const sev = vuln.severity || 'unknown';
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            });
            
            Object.entries(bySeverity).forEach(([sev, count]) => {
              body += `- **${sev.toUpperCase()}**: ${count}\n`;
            });
            
            body += '\n### Action Required\n\n';
            body += 'Run the "Fix Python Security Vulnerabilities" workflow manually to apply fixes.\n';
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Security Vulnerabilities in Python Dependencies',
                body: body,
                labels: ['security', 'dependencies', 'automated']
              });
            }

  fix-vulnerabilities:
    name: Fix Vulnerabilities
    needs: scan-vulnerabilities
    if: needs.scan-vulnerabilities.outputs.has_vulnerabilities == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backup current requirements
        run: |
          mkdir -p backups
          if [ -f requirements.txt ]; then
            cp requirements.txt backups/requirements.backup.$(date +%Y%m%d_%H%M%S).txt
          fi

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit safety

      - name: Install current dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fix vulnerabilities automatically
        id: fix
        run: |
          echo "Fixing vulnerabilities..."
          
          SEVERITY="${{ github.event.inputs.severity_level || 'high' }}"
          
          if [ "$SEVERITY" = "critical" ]; then
            # Fix only critical
            pip install --upgrade 'h11>=0.14.0' || true
          elif [ "$SEVERITY" = "high" ]; then
            # Fix critical and high
            pip install --upgrade 'h11>=0.14.0' || true
            pip install --upgrade 'django>=4.2.11' || true
            pip install --upgrade 'starlette>=0.36.2' || true
            pip install --upgrade 'brotli>=1.1.0' || true
            pip install --upgrade 'protobuf>=4.25.3' || true
            pip install --upgrade 'jupyter-core>=5.7.2' || true
            pip install --upgrade 'tornado>=6.4.1' || true
            pip install --upgrade 'setuptools>=70.0.0' || true
            pip install --upgrade 'redis>=5.0.3' || true
            pip install --upgrade 'ecdsa>=0.19.0' || true
          else
            # Fix all using pip-audit
            pip-audit --fix || true
          fi
          
          # Generate new requirements
          pip freeze > requirements.fixed.txt
          
          # Check if anything changed
          if ! cmp -s requirements.txt requirements.fixed.txt; then
            echo "changes_made=true" >> $GITHUB_OUTPUT
            mv requirements.fixed.txt requirements.txt
          else
            echo "changes_made=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests (if available)
        continue-on-error: true
        run: |
          if [ -f pytest.ini ] || [ -f setup.py ] || [ -d tests ]; then
            pip install pytest
            pytest || echo "Tests failed, but continuing..."
          fi

      - name: Create Pull Request
        if: steps.fix.outputs.changes_made == 'true' && (github.event.inputs.create_pr == 'true' || github.event.inputs.create_pr == '')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: update dependencies to fix security vulnerabilities'
          title: '🔒 Fix Python Security Vulnerabilities'
          body: |
            ## Security Vulnerability Fixes
            
            This PR updates Python dependencies to fix security vulnerabilities.
            
            ### Changes
            - Updated packages to secure versions
            - Severity level: ${{ github.event.inputs.severity_level || 'high' }}
            
            ### Testing
            - [ ] All tests pass
            - [ ] Application runs correctly
            - [ ] No breaking changes detected
            
            ### Scan Results
            See the attached artifacts for detailed vulnerability reports.
            
            ---
            *This PR was automatically generated by the vulnerability fix workflow.*
          branch: fix/security-vulnerabilities-${{ github.run_number }}
          labels: security,dependencies,automated
          assignees: ${{ github.actor }}

      - name: Upload fixed requirements
        uses: actions/upload-artifact@v4
        with:
          name: fixed-requirements
          path: |
            requirements.txt
            backups/

  deploy-to-remote:
    name: Deploy to Remote Server
    needs: fix-vulnerabilities
    if: github.event.inputs.deploy_to_remote == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download fixed requirements
        uses: actions/download-artifact@v4
        with:
          name: fixed-requirements

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy fixes to remote server
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_VENV_PATH: ${{ secrets.REMOTE_VENV_PATH }}
        run: |
          # Upload requirements file
          scp requirements.txt $REMOTE_USER@$REMOTE_HOST:~/requirements.new.txt
          
          # Execute fix on remote server
          ssh $REMOTE_USER@$REMOTE_HOST << 'ENDSSH'
            set -e
            
            echo "Activating virtual environment..."
            source $REMOTE_VENV_PATH/bin/activate
            
            echo "Creating backup..."
            pip freeze > ~/requirements.backup.$(date +%Y%m%d_%H%M%S).txt
            
            echo "Installing fixed requirements..."
            export TMPDIR=~/tmp_pip
            mkdir -p $TMPDIR
            
            pip install -r ~/requirements.new.txt
            
            echo "Deployment complete!"
            
            # Restart application if needed
            if [ -f ~/restart_app.sh ]; then
              bash ~/restart_app.sh
            fi
          ENDSSH

      - name: Verify deployment
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh $REMOTE_USER@$REMOTE_HOST << 'ENDSSH'
            source $REMOTE_VENV_PATH/bin/activate
            pip-audit || echo "Vulnerabilities may still exist"
          ENDSSH

      - name: Notify deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Security fixes deployed to remote server successfully!'
            });
