name: Setup Remote Venv (Script Version)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        default: '3.12'
      venv_name:
        description: 'Venv name (optional)'
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create venv on remote
        env:
          HOST: ${{ secrets.REMOTE_HOST }}
          USER: ${{ secrets.REMOTE_USER }}
          PY_VER: ${{ github.event.inputs.python_version }}
          VENV: ${{ github.event.inputs.venv_name }}
        run: |
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          VENV_NAME=${VENV:-venv-${PY_VER//./}}

          ssh $USER@$HOST bash << 'ENDSSH'
            set -e
            PY_VER="$PY_VER"
            VENV_NAME="$VENV_NAME"

            # Find Python
            PYTHON_CMD=""
            for cmd in python$PY_VER python${PY_VER%.*} python3; do
              if command -v $cmd &>/dev/null; then
                PYTHON_CMD=$cmd
                break
              fi
            done

            if [ -z "$PYTHON_CMD" ]; then
              echo "Python $PY_VER not found!"
              exit 1
            fi

            # Create venv
            $PYTHON_CMD -m venv ~/$VENV_NAME
            source ~/$VENV_NAME/bin/activate

            # Setup
            export TMPDIR=~/tmp_pip
            mkdir -p $TMPDIR
            pip install --upgrade pip setuptools wheel
            pip install pip-audit safety

            echo "✓ Created: ~/$VENV_NAME"
            python --version
          ENDSSH
