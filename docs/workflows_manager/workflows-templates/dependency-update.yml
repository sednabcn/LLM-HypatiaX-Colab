name: Dependency Management

on:
  schedule:
    # Check for updates every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install pip-tools pur

      - name: Check for outdated packages
        id: check
        run: |
          echo "## Outdated Packages" > outdated-report.md
          pip list --outdated --format=json > outdated.json
          python -c "
          import json
          with open('outdated.json') as f:
              outdated = json.load(f)
          if outdated:
              print(f'found={len(outdated)}')
              for pkg in outdated:
                  print(f\"- {pkg['name']}: {pkg['version']} -> {pkg['latest_version']}\")
          else:
              print('found=0')
          " | tee -a outdated-report.md
          echo "OUTDATED_COUNT=$(cat outdated-report.md | wc -l)" >> $GITHUB_OUTPUT

      - name: Update requirements files
        if: steps.check.outputs.OUTDATED_COUNT > 1
        run: |
          # Backup original files
          cp requirements.txt requirements.txt.backup || true

          # Update using pur (updates to latest compatible versions)
          pur -r requirements.txt --no-recursive || true

          # Show changes
          git diff requirements.txt || echo "No changes"

      - name: Test with updated dependencies
        if: steps.check.outputs.OUTDATED_COUNT > 1
        run: |
          pip install -r requirements.txt
          pip install -e .
          pytest tests/ --maxfail=3 || echo "Tests failed with updated deps"

      - name: Create Pull Request
        if: steps.check.outputs.OUTDATED_COUNT > 1
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "🔄 Automated Dependency Update"
          body: |
            ## Dependency Updates

            This PR updates outdated dependencies to their latest compatible versions.

            $(cat outdated-report.md)

            ### Testing
            - [ ] All tests pass with updated dependencies
            - [ ] No breaking changes detected
            - [ ] Security vulnerabilities addressed

            ### Review Checklist
            - [ ] Check for major version bumps that may need code changes
            - [ ] Review CHANGELOG/release notes for breaking changes
            - [ ] Verify CI passes all checks

            _This PR was automatically generated by the dependency update workflow._
          branch: automated-dependency-update
          delete-branch: true
          labels: dependencies, automated

  check-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --format json --output audit-report.json || true
          pip-audit --desc --format markdown > audit-report.md || true

      - name: Run Safety check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
          safety check --output text > safety-report.txt || true

      - name: Check for critical vulnerabilities
        id: vuln-check
        run: |
          if grep -q "CRITICAL" audit-report.md safety-report.txt; then
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "⚠️ CRITICAL vulnerabilities found!"
          else
            echo "critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for critical vulnerabilities
        if: steps.vuln-check.outputs.critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditReport = fs.readFileSync('audit-report.md', 'utf8');
            const safetyReport = fs.readFileSync('safety-report.txt', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Critical Security Vulnerabilities Detected',
              body: `## Security Alert

              Critical vulnerabilities have been detected in dependencies.

              ### pip-audit Results
              ${auditReport}

              ### Safety Check Results
              \`\`\`
              ${safetyReport}
              \`\`\`

              **Action Required:** Please review and update vulnerable packages immediately.`,
              labels: ['security', 'critical', 'dependencies']
            });

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: |
            audit-report.json
            audit-report.md
            safety-report.json
            safety-report.txt
