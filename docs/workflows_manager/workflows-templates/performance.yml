name: Performance Testing

on:
  workflow_dispatch:
  push:
    branches: [develop, master, main]
    paths:
      - 'hypatiax/**'
      - 'tests/performance/**'
  schedule:
    # Run performance tests weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-benchmark memory-profiler psutil
          python -m spacy download en_core_web_sm

      - name: Setup environment
        run: |
          if [ -f setup_environment.sh ]; then
            chmod +x setup_environment.sh
            ./setup_environment.sh
          fi

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-compare \
            --benchmark-autosave

      - name: Memory profiling
        run: |
          python -m memory_profiler tests/test_memory_usage.py > memory-report.txt || echo "No memory tests found"

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            benchmark-results.json
            memory-report.txt
            .benchmarks/

  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install locust faker

      - name: Run load tests
        run: |
          # Start the application in background
          python -m hypatiax.api.app &
          APP_PID=$!
          sleep 10

          # Run locust load tests
          locust -f tests/load/locustfile.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 5m \
            --html load-test-report.html \
            --csv load-test

          # Cleanup
          kill $APP_PID || true

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-report.html
            load-test_*.csv
