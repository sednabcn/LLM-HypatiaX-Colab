<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Sequential Pipeline Architecture</text>
  <text x="400" y="55" text-anchor="middle" font-size="14" fill="#64748b">Description to Formula Mapping</text>

  <rect x="250" y="80" width="300" height="60" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="white">INPUT</text>
  <text x="400" y="125" text-anchor="middle" font-size="12" fill="white">calculate area of circle</text>

  <path d="M 400 140 L 400 180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="150" y="180" width="500" height="140" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <text x="400" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">STEP 1: Description NER</text>
  <text x="400" y="225" text-anchor="middle" font-size="12" fill="#166534">Class: DescriptionNER</text>

  <text x="160" y="250" font-size="11" fill="#374151">Extracts entities from natural language</text>
  <text x="160" y="270" font-size="11" fill="#374151">Patterns: calculate=OPER, area=TARGET, circle=OBJECT</text>
  <text x="160" y="290" font-size="11" fill="#374151">Output: entities with text and label pairs</text>

  <rect x="500" y="235" width="140" height="30" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="570" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Accuracy: 100%</text>

  <path d="M 400 320 L 400 360" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="250" y="360" width="300" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Entities [Desc]</text>
  <text x="400" y="397" text-anchor="middle" font-size="10" fill="#92400e">[OPER, TARGET, OBJECT]</text>

  <path d="M 400 410 L 400 450" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="150" y="450" width="500" height="140" rx="8" fill="#fef3f2" stroke="#ef4444" stroke-width="3"/>
  <text x="400" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">STEP 2: Entity Mapper</text>
  <text x="400" y="495" text-anchor="middle" font-size="12" fill="#991b1b">Class: EntityMapper</text>

  <text x="160" y="520" font-size="11" fill="#374151">Maps description entities to formula entities</text>
  <text x="160" y="540" font-size="11" fill="#374151">Uses mapping rules dictionary</text>
  <text x="160" y="560" font-size="11" fill="#374151">Output: formula entity list with VAR, CONST, OPER</text>

  <rect x="500" y="505" width="140" height="30" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="570" y="525" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Accuracy: 100%</text>

  <path d="M 400 590 L 400 630" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="250" y="630" width="300" height="50" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Entities [Formula]</text>
  <text x="400" y="667" text-anchor="middle" font-size="10" fill="#5b21b6">[VAR, CONST, VAR, OPER]</text>

  <path d="M 400 680 L 400 720" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="150" y="720" width="500" height="120" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="3"/>
  <text x="400" y="745" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">STEP 3: Formula Generator</text>
  <text x="400" y="765" text-anchor="middle" font-size="12" fill="#075985">Class: FormulaGenerator</text>

  <text x="160" y="790" font-size="11" fill="#374151">Generates formula string from entities</text>
  <text x="160" y="810" font-size="11" fill="#374151">Adds operators and formatting</text>
  <text x="160" y="830" font-size="11" fill="#374151">Output: complete formula string</text>

  <path d="M 400 840 L 400 880" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="250" y="880" width="300" height="60" rx="8" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="905" text-anchor="middle" font-size="16" font-weight="bold" fill="white">OUTPUT</text>
  <text x="400" y="925" text-anchor="middle" font-size="12" fill="white">A = pi * r^2</text>

  <rect x="150" y="970" width="500" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="995" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Formula NER Verification</text>
  <text x="160" y="1020" font-size="11" fill="#374151">Tests generated formula against FormulaNER</text>
  <text x="160" y="1040" font-size="11" fill="#374151">Extracts entities from generated formula</text>
  <text x="160" y="1060" font-size="11" fill="#374151">Verifies accuracy of entity extraction - 100%</text>

  <rect x="50" y="1110" width="700" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="1130" font-size="12" font-weight="bold" fill="#1e293b">Key Concept:</text>
  <text x="60" y="1150" font-size="10" fill="#475569">Each component is tested independently to measure accuracy</text>
  <text x="60" y="1165" font-size="10" fill="#475569">and control error propagation through the pipeline.</text>
</svg>
